name: mtcc build and test

on:
  push:
    branches: [mtc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
          - os: macos-latest
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - run: sh scripts/build-mtcc.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mtcc-${{ matrix.artifact }}
          path: dist/mtcc-${{ matrix.artifact }}
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - shell: pwsh
        run: .\win32\build-mtcc.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: mtcc-windows-x64
          path: dist/mtcc-windows-x64.exe
          if-no-files-found: error
